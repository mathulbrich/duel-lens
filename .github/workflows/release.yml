# The GitHub release of a version, built by GitHub from its tag (docs/release/packaging.md, "GitHub release").
#
# Push a tag v<version> (the manifest's version) and this:
# 1. checks out that tag and installs the locked dependencies (no cache: a release never builds from one);
# 2. runs `npm run release -- --skip-e2e`: tsc, vitest (Firefox ESR loads the Firefox build), the production build,
#    its verification, and the zip with its SHA-256. The zip is byte-for-byte reproducible: the same commit built
#    with `npm run release` anywhere gives the same SHA-256. The E2E test needs the fixture card images, which aren't
#    in the repository: run it locally before tagging (`npx tsx test/e2e/run.ts --click`);
# 3. attests the zip's build provenance (Sigstore, through GitHub): anyone can check it was built here, from this tag,
#    with `gh attestation verify duel-lens-<version>.zip -R mathulbrich/duel-lens`;
# 4. creates a draft release with the zip, its .sha256 and the install and verify notes. Write "What's new", then
#    publish it by hand. With release immutability on (Settings, General, Releases), a published release's files and
#    tag can't be changed.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write # the draft release
      id-token: write # the Sigstore certificate for the attestation
      attestations: write # the attestation itself
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: The tag names the manifest's version
        id: version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but extension/manifest.json says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: |
          npm ci --no-audit --no-fund
          # The E2E harness's own install: the tsc check of its code, and Puppeteer for nothing else here.
          PUPPETEER_SKIP_DOWNLOAD=true npm ci --prefix test/e2e --no-audit --no-fund

      # tools/release.test.ts loads the Firefox build in Firefox and wants 0 warnings. The ESR, as the Docker
      # low-end runs use (the latest release's WebDriver BiDi has broken that check before).
      - name: Firefox ESR
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/firefox.tar" "https://download.mozilla.org/?product=firefox-esr-latest-ssl&os=linux64&lang=en-US"
          tar -xf "$RUNNER_TEMP/firefox.tar" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/firefox/firefox" --version
          echo "FIREFOX_BIN=$RUNNER_TEMP/firefox/firefox" >> "$GITHUB_ENV"

      - name: Checks, build, verification, zip
        run: npm run release -- --skip-e2e

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/duel-lens-${{ steps.version.outputs.version }}.zip

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          zip="release/duel-lens-$VERSION.zip"
          sum=$(cut -d' ' -f1 "$zip.sha256")
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## What's new

          <!-- Write the changes since the previous version here, then publish. -->

          ## Install

          - **Chrome Web Store** (Chrome, Brave, Vivaldi, Edge): [install Duel Lens](https://chromewebstore.google.com/detail/cigbnalidhajeoancmafhnobolodeoei). It updates itself.
          - **Firefox Add-ons**: [install Duel Lens](https://addons.mozilla.org/firefox/addon/duel-lens/). It updates itself.
          - **Manual install**: download \`duel-lens-$VERSION.zip\` below and follow the [README](https://github.com/mathulbrich/duel-lens#install). It doesn't update itself, but tells you when a new version is out. To update, unzip the new version **into the same folder**, then click reload in \`chrome://extensions\`.

          ## Verify this download

          GitHub built \`duel-lens-$VERSION.zip\` from the tag \`v$VERSION\` ([the build]($RUN_URL)), and signed where it came from. To check it:

          \`\`\`
          gh attestation verify duel-lens-$VERSION.zip -R mathulbrich/duel-lens
          \`\`\`

          SHA-256: \`$sum\`
          EOF
          gh release create "v$VERSION" "$zip" "$zip.sha256" \
            --draft --verify-tag \
            --title "Duel Lens $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
